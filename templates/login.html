
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MediCare AI</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 32px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
        }

        .brand {
            color: #0d9488;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h1 { margin-bottom: 8px; font-size: 28px; }
        .subtitle { color: #64748b; line-height: 1.5; }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #99f6e4;
            border-color: #0d9488;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #115e59; }

        .error {
            padding: 12px;
            margin-top: 18px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }

        .notice {
            margin-top: 22px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">MEDICARE AI</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in with your authorized account.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <label for="email">Email address</label>
            <input
                id="email"
                name="email"
                type="email"
                maxlength="255"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                maxlength="128"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign in</button>
        </form>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <p class="notice">
            Educational prototype only. This system is not intended
            for emergency care or independent medical diagnosis.
        </p>
    </main>
</body>
</html>
